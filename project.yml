name: Sauron
options:
  bundleIdPrefix: app.sauron
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.15.7
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
targets:
  Sauron:
    type: application
    platform: macOS
    sources:
      - path: Sauron
        excludes:
          - Info.plist
          - Sauron.entitlements
    settings:
      base:
        PRODUCT_NAME: Sauron
        PRODUCT_BUNDLE_IDENTIFIER: app.sauron.Sauron
        MARKETING_VERSION: 0.1.24
        CURRENT_PROJECT_VERSION: 25
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sauron/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Sauron
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        CODE_SIGN_ENTITLEMENTS: Sauron/Sauron.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: MZSC4FTLNA
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_TESTABILITY: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: targeted
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - sdk: ScreenCaptureKit.framework
      - sdk: Speech.framework
      - sdk: EventKit.framework
      - sdk: AVFoundation.framework
      - sdk: SwiftData.framework
      - sdk: Charts.framework
      - sdk: PDFKit.framework
      - package: FluidAudio
        product: FluidAudio
    scheme:
      testTargets:
        - SauronTests
  SauronTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SauronTests
    dependencies:
      - target: Sauron
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sauron.SauronTests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
schemes:
  Sauron:
    build:
      targets:
        Sauron: all
        SauronTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-ApplePersistenceIgnoreState": true
    test:
      config: Debug
      targets:
        - SauronTests
